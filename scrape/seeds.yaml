# ─────────────────────────────────────────────────────────
# CRAWL CONFIG (chung)
# ─────────────────────────────────────────────────────────

config:
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) RAG-Research-Bot/1.0"
  timeout_sec: 15
  max_retries: 3
  max_depth: 1            # Từ mỗi seed, follow link 1 cấp
  output_dir: data/raw
  output_format: jsonl
  follow_pdf: true        # Tự động tải PDF nếu gặp
  pdf_size_limit_mb: 50
  blacklist_patterns:     # KHÔNG crawl
    - "/login"
    - "/admin"
    - "\\?print=1"
    - "\\.(jpg|png|gif|mp4|zip)$"
